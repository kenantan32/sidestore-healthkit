name: build
on: [push, workflow_dispatch]
env:
  SIDESTORE_REF: 0.7.0-alpha
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: patcher
      - uses: actions/checkout@v4
        with:
          repository: SideStore/SideStore
          ref: ${{ env.SIDESTORE_REF }}
          submodules: recursive
          path: ss
      - run: brew install ldid xcbeautify
      - uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.4"
      - name: Patch SideSign
        working-directory: ss
        run: |
          python3 ../patcher/patch_healthkit.py
          git -C Dependencies/SideSign diff
      - name: Build
        working-directory: ss
        run: python3 scripts/ci/workflow.py build
      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-healthkit
          path: ss/SideStore.ipa
